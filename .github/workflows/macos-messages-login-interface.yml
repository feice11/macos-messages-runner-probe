name: macOS Messages login interface check

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Inspect the official Messages scripting dictionary
        shell: bash
        run: |
          app=/System/Applications/Messages.app
          codesign --verify -- "$app"
          dictionary=$(mktemp)
          trap 'rm -f "$dictionary"' EXIT
          sdef "$app" > "$dictionary"
          python3 - "$dictionary" <<'PY'
          import re
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          commands = root.findall(".//command")
          assert commands, "The scripting dictionary contains no commands."
          auth = re.compile(r"log.?in|sign.?in|auth|register|password|verif", re.I)

          print(f"Dictionary command count: {len(commands)}")
          names = []
          for command in commands:
              name = command.attrib["name"]
              names.append(name)
              if auth.search(name):
                  direct = command.find("direct-parameter")
                  direct_type = direct.attrib.get("type", "(unspecified)") if direct is not None else "(none)"
                  parameters = [parameter.attrib["name"] for parameter in command.findall("parameter")]
                  print(f"Authentication-related command: {name}; direct parameter: {direct_type}; "
                        f"named parameters: {', '.join(parameters) or '(none)'}")
                  print(f"Command description: {command.attrib.get('description', '(none)')}")
          print("Declared commands:", ", ".join(sorted(set(names))))

          for item in root.findall(".//class"):
              name = item.attrib["name"]
              if name in {"account", "service"}:
                  fields = [field.attrib["name"] for field in item.findall("property")]
                  print(f"Declared {name} properties: {', '.join(fields)}")

          print("Stage: public scripting interface inspection. Apple login unattempted.")
          PY

      - name: Check permission to access the official login window
        shell: bash
        run: |
          app=/System/Applications/Messages.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          open "$app"
          work=$(mktemp -d)
          trap 'rm -f "$work/probe.swift"; rmdir "$work"' EXIT
          cat > "$work/probe.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices
          import Carbon
          import CoreGraphics
          import Darwin

          let trusted = AXIsProcessTrusted()
          print("Accessibility client trusted: \(trusted)")
          print("Keyboard event posting authorized: \(CGPreflightPostEventAccess())")
          guard trusted else {
              print("Stage: stopped before reading or interacting with login controls.")
              exit(EXIT_SUCCESS)
          }
          guard var app = NSRunningApplication.runningApplications(withBundleIdentifier: CommandLine.arguments[1]).first else {
              print("Stage: Messages process not found.")
              exit(EXIT_FAILURE)
          }
          _ = app.activate(options: [])

          func attribute(_ node: AXUIElement, _ name: String) -> CFTypeRef? {
              var value: CFTypeRef?
              return AXUIElementCopyAttributeValue(node, name as CFString, &value) == .success ? value : nil
          }

          func waitForWindows() -> [AXUIElement] {
              let application = AXUIElementCreateApplication(app.processIdentifier)
              var lastError = AXError.success
              for _ in 0..<12 {
                  var value: CFTypeRef?
                  lastError = AXUIElementCopyAttributeValue(application, kAXWindowsAttribute as CFString, &value)
                  if let windows = value as? [AXUIElement], !windows.isEmpty {
                      return windows
                  }
                  RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              }
              print("Window query result: \(lastError.rawValue); app active: \(app.isActive)")
              return []
          }

          var windows = waitForWindows()
          if windows.isEmpty && CGPreflightPostEventAccess(),
             let keyDown = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(kVK_ANSI_Comma), keyDown: true),
             let keyUp = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(kVK_ANSI_Comma), keyDown: false) {
              keyDown.flags = .maskCommand
              keyUp.flags = .maskCommand
              keyDown.postToPid(app.processIdentifier)
              keyUp.postToPid(app.processIdentifier)
              print("Sent the Settings shortcut to Messages.")
              windows = waitForWindows()
          }
          print("Accessible Messages window count: \(windows.count)")

          func descendants(_ roots: [AXUIElement]) -> [AXUIElement] {
              var nodes = roots
              var index = 0
              while index < min(nodes.count, 500) {
                  let node = nodes[index]
                  index += 1
                  nodes.append(contentsOf: attribute(node, kAXChildrenAttribute) as? [AXUIElement] ?? [])
              }
              return Array(nodes.prefix(500))
          }

          func label(_ node: AXUIElement) -> String {
              [kAXTitleAttribute, kAXDescriptionAttribute, "AXPlaceholderValue"].compactMap {
                  attribute(node, $0) as? String
              }.joined(separator: " ").lowercased()
          }

          func accountFields(_ nodes: [AXUIElement]) -> [AXUIElement] {
              nodes.filter { node in
                  guard (attribute(node, kAXRoleAttribute) as? String) == kAXTextFieldRole,
                        (attribute(node, kAXSubroleAttribute) as? String) != "AXSecureTextField" else { return false }
                  let hints = label(node)
                  return !hints.contains("password")
                      && ["apple account", "apple id", "email", "phone number"].contains { hints.contains($0) }
              }
          }

          func openSignInEntry(_ nodes: [AXUIElement], source: String) -> [AXUIElement] {
              guard let entry = nodes.first(where: { node in
                  let role = attribute(node, kAXRoleAttribute) as? String
                  let title = (attribute(node, kAXTitleAttribute) as? String
                      ?? attribute(node, kAXDescriptionAttribute) as? String ?? "")
                      .lowercased().trimmingCharacters(in: CharacterSet(charactersIn: " .…"))
                  return (role == kAXButtonRole || role == "AXLink")
                      && ["sign in", "sign in to your apple account", "sign in to apple account"].contains(title)
              }) else {
                  print("\(source) sign-in entry not exposed.")
                  return nodes
              }
              let result = AXUIElementPerformAction(entry, kAXPressAction as CFString)
              print("\(source) sign-in entry action: \(result.rawValue)")
              RunLoop.current.run(until: Date().addingTimeInterval(3))
              return descendants(waitForWindows())
          }

          var nodes = descendants(windows)
          if let tab = nodes.first(where: {
              let role = attribute($0, kAXRoleAttribute) as? String
              return (role == kAXButtonRole || role == kAXRadioButtonRole)
                  && (attribute($0, kAXTitleAttribute) as? String) == "iMessage"
          }) {
              let result = AXUIElementPerformAction(tab, kAXPressAction as CFString)
              print("iMessage settings tab action: \(result.rawValue)")
              RunLoop.current.run(until: Date().addingTimeInterval(2))
              nodes = descendants(waitForWindows())
          }

          if accountFields(nodes).isEmpty {
              nodes = openSignInEntry(nodes, source: "Messages")
          }
          if accountFields(nodes).isEmpty {
              let opener = Process()
              opener.executableURL = URL(fileURLWithPath: "/usr/bin/open")
              opener.arguments = ["/System/Applications/System Settings.app"]
              try opener.run()
              opener.waitUntilExit()
              for _ in 0..<10 {
                  if let settings = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.systempreferences").first {
                      app = settings
                      _ = app.activate(options: [])
                      nodes = openSignInEntry(descendants(waitForWindows()), source: "System Settings")
                      break
                  }
                  RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              }
          }
          let candidates = accountFields(nodes)
          print("Identifiable account field count: \(candidates.count)")
          guard candidates.count == 1, let field = candidates.first,
                CGPreflightPostEventAccess(),
                (attribute(field, kAXValueAttribute) as? String) == "",
                AXUIElementSetAttributeValue(field, kAXFocusedAttribute as CFString, kCFBooleanTrue) == .success,
                (attribute(field, kAXFocusedAttribute) as? Bool) == true else {
              print("Stage: no unambiguous, empty, focused account field. No credentials or text sent.")
              exit(EXIT_SUCCESS)
          }

          let marker = "imochige-test@example.invalid"
          let units = Array(marker.utf16)
          guard let down = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: true),
                let up = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: false) else {
              exit(EXIT_FAILURE)
          }
          units.withUnsafeBufferPointer {
              down.keyboardSetUnicodeString(stringLength: $0.count, unicodeString: $0.baseAddress)
          }
          down.postToPid(app.processIdentifier)
          up.postToPid(app.processIdentifier)
          RunLoop.current.run(until: Date().addingTimeInterval(0.5))
          let confirmed = (attribute(field, kAXValueAttribute) as? String) == marker
          print("Synthetic account field value verified: \(confirmed)")
          if confirmed {
              for (key, flags) in [(kVK_ANSI_A, CGEventFlags.maskCommand), (kVK_Delete, CGEventFlags())] {
                  let keyDown = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(key), keyDown: true)
                  let keyUp = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(key), keyDown: false)
                  keyDown?.flags = flags
                  keyUp?.flags = flags
                  keyDown?.postToPid(app.processIdentifier)
                  keyUp?.postToPid(app.processIdentifier)
              }
              RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              print("Synthetic account field cleared: \((attribute(field, kAXValueAttribute) as? String) == "")")
          }
          print("Stage: synthetic UI input check. Apple login unattempted.")
          SWIFT
          swift "$work/probe.swift" "$bundle_id"
