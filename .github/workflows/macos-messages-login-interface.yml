name: macOS Messages login interface check

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Inspect the official Messages scripting dictionary
        shell: bash
        run: |
          app=/System/Applications/Messages.app
          codesign --verify -- "$app"
          dictionary=$(mktemp)
          trap 'rm -f "$dictionary"' EXIT
          sdef "$app" > "$dictionary"
          python3 - "$dictionary" <<'PY'
          import re
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          commands = root.findall(".//command")
          assert commands, "The scripting dictionary contains no commands."
          auth = re.compile(r"log.?in|sign.?in|auth|register|password|verif", re.I)

          print(f"Dictionary command count: {len(commands)}")
          names = []
          for command in commands:
              name = command.attrib["name"]
              names.append(name)
              if auth.search(name):
                  direct = command.find("direct-parameter")
                  direct_type = direct.attrib.get("type", "(unspecified)") if direct is not None else "(none)"
                  parameters = [parameter.attrib["name"] for parameter in command.findall("parameter")]
                  print(f"Authentication-related command: {name}; direct parameter: {direct_type}; "
                        f"named parameters: {', '.join(parameters) or '(none)'}")
                  print(f"Command description: {command.attrib.get('description', '(none)')}")
          print("Declared commands:", ", ".join(sorted(set(names))))

          for item in root.findall(".//class"):
              name = item.attrib["name"]
              if name in {"account", "service"}:
                  fields = [field.attrib["name"] for field in item.findall("property")]
                  print(f"Declared {name} properties: {', '.join(fields)}")

          print("Stage: public scripting interface inspection. Apple login unattempted.")
          PY

      - name: Check permission to access the official login window
        shell: bash
        run: |
          app=/System/Applications/Messages.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          open "$app"
          work=$(mktemp -d)
          trap 'rm -f "$work/probe.swift"; rmdir "$work"' EXIT
          cat > "$work/probe.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices
          import CoreGraphics
          import Darwin

          let trusted = AXIsProcessTrusted()
          print("Accessibility client trusted: \(trusted)")
          print("Keyboard event posting authorized: \(CGPreflightPostEventAccess())")
          guard trusted else {
              print("Stage: stopped before reading or interacting with login controls.")
              exit(EXIT_SUCCESS)
          }
          guard let app = NSRunningApplication.runningApplications(withBundleIdentifier: CommandLine.arguments[1]).first else {
              print("Stage: Messages process not found.")
              exit(EXIT_FAILURE)
          }

          func attribute(_ node: AXUIElement, _ name: String) -> CFTypeRef? {
              var value: CFTypeRef?
              return AXUIElementCopyAttributeValue(node, name as CFString, &value) == .success ? value : nil
          }

          let application = AXUIElementCreateApplication(app.processIdentifier)
          let windows = attribute(application, kAXWindowsAttribute) as? [AXUIElement] ?? []
          print("Accessible Messages window count: \(windows.count)")
          var queue = windows
          var next = 0
          var fields = 0
          var editable = 0
          while next < min(queue.count, 500) {
              let node = queue[next]
              next += 1
              if (attribute(node, kAXRoleAttribute) as? String) == kAXTextFieldRole {
                  fields += 1
                  var settable = DarwinBoolean(false)
                  if AXUIElementIsAttributeSettable(node, kAXValueAttribute as CFString, &settable) == .success,
                     settable.boolValue {
                      editable += 1
                  }
              }
              queue.append(contentsOf: attribute(node, kAXChildrenAttribute) as? [AXUIElement] ?? [])
          }
          print("Exposed text field count: \(fields); writable: \(editable)")
          print("Stage: read-only UI inspection. No field values read and no input sent.")
          SWIFT
          swift "$work/probe.swift" "$bundle_id"
