name: macOS Messages login interface check

on:
  workflow_dispatch:
    inputs:
      probe_nonce:
        description: Synthetic test marker (12 lowercase hex digits)
        type: string
        required: true

permissions: {}

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Inspect the official Messages scripting dictionary
        shell: bash
        run: |
          app=/System/Applications/Messages.app
          codesign --verify -- "$app"
          dictionary=$(mktemp)
          trap 'rm -f "$dictionary"' EXIT
          sdef "$app" > "$dictionary"
          python3 - "$dictionary" <<'PY'
          import re
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          commands = root.findall(".//command")
          assert commands, "The scripting dictionary contains no commands."
          auth = re.compile(r"log.?in|sign.?in|auth|register|password|verif", re.I)

          print(f"Dictionary command count: {len(commands)}")
          names = []
          for command in commands:
              name = command.attrib["name"]
              names.append(name)
              if auth.search(name):
                  direct = command.find("direct-parameter")
                  direct_type = direct.attrib.get("type", "(unspecified)") if direct is not None else "(none)"
                  parameters = [parameter.attrib["name"] for parameter in command.findall("parameter")]
                  print(f"Authentication-related command: {name}; direct parameter: {direct_type}; "
                        f"named parameters: {', '.join(parameters) or '(none)'}")
                  print(f"Command description: {command.attrib.get('description', '(none)')}")
          print("Declared commands:", ", ".join(sorted(set(names))))

          for item in root.findall(".//class"):
              name = item.attrib["name"]
              if name in {"account", "service"}:
                  fields = [field.attrib["name"] for field in item.findall("property")]
                  print(f"Declared {name} properties: {', '.join(fields)}")

          print("Stage: public scripting interface inspection. Apple login unattempted.")
          PY

      - name: Check permission to access the official login window
        shell: bash
        run: |
          nonce=$(python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event:
              nonce = json.load(event).get("inputs", {}).get("probe_nonce", "")
          if not re.fullmatch(r"[0-9a-f]{12}", nonce):
              raise SystemExit("Expected a synthetic marker containing exactly 12 lowercase hex digits.")
          print(nonce)
          PY
          )
          printf 'Synthetic dispatch marker received: %s\n' "$nonce"
          app=/System/Applications/Messages.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          open "$app"
          work=$(mktemp -d)
          trap 'rm -f "$work/probe.swift"; rmdir "$work"' EXIT
          cat > "$work/probe.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices
          import Carbon
          import CoreGraphics
          import Darwin

          let trusted = AXIsProcessTrusted()
          print("Accessibility client trusted: \(trusted)")
          print("Keyboard event posting authorized: \(CGPreflightPostEventAccess())")
          guard trusted else {
              print("Stage: stopped before reading or interacting with login controls.")
              exit(EXIT_SUCCESS)
          }
          guard var app = NSRunningApplication.runningApplications(withBundleIdentifier: CommandLine.arguments[1]).first else {
              print("Stage: Messages process not found.")
              exit(EXIT_FAILURE)
          }
          _ = app.activate(options: [])

          func attribute(_ node: AXUIElement, _ name: String) -> CFTypeRef? {
              var value: CFTypeRef?
              return AXUIElementCopyAttributeValue(node, name as CFString, &value) == .success ? value : nil
          }

          func waitForWindows(in target: NSRunningApplication? = nil) -> [AXUIElement] {
              let target = target ?? app
              let application = AXUIElementCreateApplication(target.processIdentifier)
              var lastError = AXError.success
              for _ in 0..<12 {
                  var value: CFTypeRef?
                  lastError = AXUIElementCopyAttributeValue(application, kAXWindowsAttribute as CFString, &value)
                  if let windows = value as? [AXUIElement], !windows.isEmpty {
                      return windows
                  }
                  RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              }
              print("Window query result: \(lastError.rawValue); app active: \(target.isActive)")
              return []
          }

          var windows = waitForWindows()
          if windows.isEmpty && CGPreflightPostEventAccess(),
             let keyDown = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(kVK_ANSI_Comma), keyDown: true),
             let keyUp = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(kVK_ANSI_Comma), keyDown: false) {
              keyDown.flags = .maskCommand
              keyUp.flags = .maskCommand
              keyDown.postToPid(app.processIdentifier)
              keyUp.postToPid(app.processIdentifier)
              print("Sent the Settings shortcut to Messages.")
              windows = waitForWindows()
          }
          print("Accessible Messages window count: \(windows.count)")

          func descendants(_ roots: [AXUIElement]) -> [AXUIElement] {
              var nodes = roots
              var index = 0
              while index < min(nodes.count, 500) {
                  let node = nodes[index]
                  index += 1
                  nodes.append(contentsOf: attribute(node, kAXChildrenAttribute) as? [AXUIElement] ?? [])
              }
              return Array(nodes.prefix(500))
          }

          func label(_ node: AXUIElement) -> String {
              [kAXTitleAttribute, kAXDescriptionAttribute, "AXPlaceholderValue"].compactMap {
                  attribute(node, $0) as? String
              }.joined(separator: " ").lowercased()
          }

          func ordinaryTextField(_ node: AXUIElement) -> Bool {
              let subrole = attribute(node, kAXSubroleAttribute) as? String ?? ""
              let hints = label(node)
              return (attribute(node, kAXRoleAttribute) as? String) == kAXTextFieldRole
                  && !["AXSecureTextField", "AXSearchField"].contains(subrole)
                  && !hints.contains("password") && !hints.contains("search")
                  && (attribute(node, kAXEnabledAttribute) as? Bool) != false
          }

          func accountFields(_ nodes: [AXUIElement]) -> [AXUIElement] {
              let hints = ["apple account", "apple id", "email", "phone number"]
              let labelled = nodes.filter { node in
                  ordinaryTextField(node) && hints.contains { label(node).contains($0) }
              }
              if !labelled.isEmpty { return labelled }
              let windows = nodes.filter(isSignInWindow)
              guard windows.count == 1, let window = windows.first else { return [] }
              let windowNodes = descendants([window])
              let hasAccountPrompt = windowNodes.contains { node in
                  guard (attribute(node, kAXRoleAttribute) as? String) == kAXStaticTextRole else { return false }
                  let caption = (attribute(node, kAXValueAttribute) as? String ?? "").lowercased() + " " + label(node)
                  return caption.contains("email") && caption.contains("phone number")
              }
              guard hasAccountPrompt else { return [] }
              let fields = windowNodes.filter { ordinaryTextField($0) }
              if fields.count == 1 { return fields }
              return fields.filter { (attribute($0, kAXFocusedAttribute) as? Bool) == true }
          }

          func reportSurface(_ nodes: [AXUIElement], source: String) {
              let labels = nodes.map { node in
                  let staticText = (attribute(node, kAXRoleAttribute) as? String) == kAXStaticTextRole
                      ? (attribute(node, kAXValueAttribute) as? String ?? "") : ""
                  return label(node) + " " + staticText.lowercased()
              }
              let signals = ["apple account", "sign in", "unable", "not available", "email", "phone number",
                             "could not connect", "connection failed", "enter", "continue", "cancel", "try again",
                             "use another apple device", "nearby device", "passkey", "qr code", "sign in with iphone",
                             "sign in with your iphone", "other sign-in options", "security key"]
                  .filter { signal in labels.contains { $0.contains(signal) } }
              print("\(source) surface: \(nodes.count) controls; known login signals: \(signals.joined(separator: ", "))")
          }

          func isSignInWindow(_ node: AXUIElement) -> Bool {
              let title = (attribute(node, kAXTitleAttribute) as? String)?.lowercased() ?? ""
              return (attribute(node, kAXRoleAttribute) as? String) == kAXWindowRole
                  && ["sign in", "sign in to your apple account", "apple account"].contains(title)
          }

          func reportSignInWindow(_ window: AXUIElement, source: String) {
              let windowNodes = descendants([window])
              let types = [kAXTextFieldRole, kAXStaticTextRole, kAXButtonRole, "AXWebArea", "AXSheet", "AXProgressIndicator"]
              let counts = types.map { role in
                  let count = windowNodes.filter { (attribute($0, kAXRoleAttribute) as? String) == role }.count
                  return "\(role)=\(count)"
              }
              print("\(source) sign-in window roles: \(counts.joined(separator: ", "))")
              reportSurface(windowNodes, source: "\(source) sign-in window")
              for field in windowNodes.filter({ (attribute($0, kAXRoleAttribute) as? String) == kAXTextFieldRole }) {
                  let subrole = attribute(field, kAXSubroleAttribute) as? String ?? ""
                  let classification = ["AXSearchField", "AXSecureTextField"].contains(subrole) ? subrole : "ordinary"
                  let focused = (attribute(field, kAXFocusedAttribute) as? Bool) == true
                  let empty = (attribute(field, kAXValueAttribute) as? String) == ""
                  print("\(source) sign-in text field: \(classification), focused: \(focused), empty: \(empty)")
              }
          }

          func reportAlternativeSignInActions(_ nodes: [AXUIElement], source: String) {
              let hints = ["another apple device", "nearby device", "passkey", "qr code",
                           "with iphone", "with your iphone", "other sign-in options", "security key"]
              let matches = nodes.filter { node in
                  var actions: CFArray?
                  return hints.contains { label(node).contains($0) }
                      && AXUIElementCopyActionNames(node, &actions) == .success
                      && (actions as? [String])?.contains(kAXPressAction) == true
                      && (attribute(node, kAXEnabledAttribute) as? Bool) != false
              }
              print("\(source) alternate Apple sign-in action count: \(matches.count)")
          }

          func openSignInEntry(_ nodes: [AXUIElement], source: String) -> [AXUIElement] {
              let titles = ["sign in", "sign in to your apple account", "sign in to apple account",
                            "sign in with your apple account", "sign in with apple account"]
              let matches = nodes.filter { node in
                  var attributes = [kAXTitleAttribute, kAXDescriptionAttribute]
                  if (attribute(node, kAXRoleAttribute) as? String) == kAXStaticTextRole {
                      attributes.append(kAXValueAttribute)
                  }
                  return attributes.compactMap { attribute(node, $0) as? String }.contains { value in
                      titles.contains(value.lowercased().trimmingCharacters(in: CharacterSet(charactersIn: " .…")))
                  }
              }
              var entries: [AXUIElement] = []
              for match in matches {
                  var node = match
                  var roles: [String] = []
                  for _ in 0..<4 {
                      let role = attribute(node, kAXRoleAttribute) as? String ?? ""
                      roles.append(role)
                      var actions: CFArray?
                      if AXUIElementCopyActionNames(node, &actions) == .success,
                         (actions as? [String])?.contains(kAXPressAction) == true,
                         (attribute(node, kAXEnabledAttribute) as? Bool) != false {
                          if !entries.contains(where: { CFEqual($0, node) }) { entries.append(node) }
                          break
                      }
                      guard role != kAXWindowRole,
                            let parent = attribute(node, kAXParentAttribute),
                            CFGetTypeID(parent) == AXUIElementGetTypeID() else { break }
                      node = unsafeDowncast(parent, to: AXUIElement.self)
                  }
                  print("\(source) sign-in label roles: \(roles.joined(separator: " / "))")
              }
              print("\(source) sign-in action candidate count: \(entries.count)")
              guard entries.count == 1, let entry = entries.first else {
                  return nodes
              }
              let result = AXUIElementPerformAction(entry, kAXPressAction as CFString)
              print("\(source) sign-in entry action: \(result.rawValue)")
              var currentNodes = nodes
              for _ in 0..<16 {
                  RunLoop.current.run(until: Date().addingTimeInterval(0.5))
                  currentNodes = descendants(waitForWindows())
                  if !accountFields(currentNodes).isEmpty { break }
              }
              reportSurface(currentNodes, source: "\(source) after sign-in action")
              return currentNodes
          }

          var nodes = descendants(windows)
          if let tab = nodes.first(where: {
              let role = attribute($0, kAXRoleAttribute) as? String
              return (role == kAXButtonRole || role == kAXRadioButtonRole)
                  && (attribute($0, kAXTitleAttribute) as? String) == "iMessage"
          }) {
              let result = AXUIElementPerformAction(tab, kAXPressAction as CFString)
              print("iMessage settings tab action: \(result.rawValue)")
              RunLoop.current.run(until: Date().addingTimeInterval(2))
              nodes = descendants(waitForWindows())
          }

          if accountFields(nodes).isEmpty {
              reportSurface(nodes, source: "Messages")
              reportAlternativeSignInActions(nodes, source: "Messages")
              nodes = openSignInEntry(nodes, source: "Messages")
          }
          if accountFields(nodes).isEmpty {
              let opener = Process()
              opener.executableURL = URL(fileURLWithPath: "/usr/bin/open")
              opener.arguments = ["x-apple.systempreferences:com.apple.systempreferences.AppleIDSettings"]
              try opener.run()
              opener.waitUntilExit()
              print("Apple Account settings link exit code: \(opener.terminationStatus)")
              for _ in 0..<10 {
                  if let settings = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.systempreferences").first {
                      app = settings
                      _ = app.activate(options: [])
                      let accountPane = descendants(waitForWindows())
                      reportSurface(accountPane, source: "System Settings")
                      nodes = accountFields(accountPane).isEmpty
                          ? openSignInEntry(accountPane, source: "System Settings")
                          : accountPane
                      for _ in 0..<20 {
                          if !accountFields(nodes).isEmpty { break }
                          RunLoop.current.run(until: Date().addingTimeInterval(0.5))
                          nodes = descendants(waitForWindows())
                      }
                      for window in nodes.filter(isSignInWindow) {
                          reportSignInWindow(window, source: "System Settings")
                          reportAlternativeSignInActions(descendants([window]), source: "System Settings")
                      }
                      if accountFields(nodes).isEmpty {
                          let authIdentifiers = ["appleid", "appleaccount", "authkit"]
                          for helper in NSWorkspace.shared.runningApplications {
                              guard let identifier = helper.bundleIdentifier, identifier.hasPrefix("com.apple."),
                                    authIdentifiers.contains(where: { identifier.lowercased().contains($0) }) else { continue }
                              let process = AXUIElementCreateApplication(helper.processIdentifier)
                              let helperWindows = attribute(process, kAXWindowsAttribute) as? [AXUIElement] ?? []
                              print("Apple sign-in helper: \(identifier), windows: \(helperWindows.count)")
                              let signInWindows = helperWindows.filter(isSignInWindow)
                              for window in signInWindows { reportSignInWindow(window, source: identifier) }
                              let helperNodes = descendants(signInWindows)
                              if accountFields(helperNodes).count == 1 {
                                  app = helper
                                  _ = app.activate(options: [])
                                  nodes = helperNodes
                                  break
                              }
                          }
                      }
                      break
                  }
                  RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              }
          }
          let candidates = accountFields(nodes)
          print("Identifiable account field count: \(candidates.count)")
          guard candidates.count == 1, let field = candidates.first,
                CGPreflightPostEventAccess(),
                (attribute(field, kAXValueAttribute) as? String) == "" else {
              print("Stage: no unambiguous, empty account field. No credentials or text sent.")
              exit(EXIT_SUCCESS)
          }
          if (attribute(field, kAXFocusedAttribute) as? Bool) != true {
              let focusResult = AXUIElementSetAttributeValue(field, kAXFocusedAttribute as CFString, kCFBooleanTrue)
              print("Synthetic account field focus action: \(focusResult.rawValue)")
              RunLoop.current.run(until: Date().addingTimeInterval(0.2))
          }
          guard app.isActive,
                (attribute(field, kAXFocusedAttribute) as? Bool) == true else {
              print("Stage: could not confirm keyboard focus for the account field. No credentials or text sent.")
              exit(EXIT_SUCCESS)
          }

          let marker = "probe-\(CommandLine.arguments[2])@example.invalid"
          var writable: DarwinBoolean = false
          let query = AXUIElementIsAttributeSettable(field, kAXValueAttribute as CFString, &writable)
          let canSetValue = query == .success && writable.boolValue
          print("Synthetic account field AXValue writable: \(canSetValue)")
          if canSetValue {
              let write = AXUIElementSetAttributeValue(field, kAXValueAttribute as CFString, marker as CFString)
              print("Synthetic account field AXValue write result: \(write.rawValue)")
              RunLoop.current.run(until: Date().addingTimeInterval(0.5))
          }
          if (attribute(field, kAXValueAttribute) as? String) == "",
             NSWorkspace.shared.frontmostApplication?.processIdentifier == app.processIdentifier {
              print("Synthetic account field trying the frontmost keyboard route.")
              for unit in marker.utf16 {
                  guard app.isActive,
                        (attribute(field, kAXFocusedAttribute) as? Bool) == true,
                        let down = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: true),
                        let up = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: false) else { break }
                  var character = unit
                  down.keyboardSetUnicodeString(stringLength: 1, unicodeString: &character)
                  down.post(tap: .cghidEventTap)
                  up.post(tap: .cghidEventTap)
                  RunLoop.current.run(until: Date().addingTimeInterval(0.025))
              }
          }
          RunLoop.current.run(until: Date().addingTimeInterval(0.5))
          let entered = attribute(field, kAXValueAttribute) as? String ?? ""
          print("Synthetic account field value verified: \(entered == marker); observed length: \(entered.count)")
          if !entered.isEmpty, marker.hasPrefix(entered) {
              if canSetValue {
                  _ = AXUIElementSetAttributeValue(field, kAXValueAttribute as CFString, "" as CFString)
              }
              if (attribute(field, kAXValueAttribute) as? String) == entered,
                 NSWorkspace.shared.frontmostApplication?.processIdentifier == app.processIdentifier,
                 (attribute(field, kAXFocusedAttribute) as? Bool) == true {
                  for (key, flags) in [(kVK_ANSI_A, CGEventFlags.maskCommand), (kVK_Delete, CGEventFlags())] {
                      let keyDown = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(key), keyDown: true)
                      let keyUp = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(key), keyDown: false)
                      keyDown?.flags = flags
                      keyUp?.flags = flags
                      keyDown?.post(tap: .cghidEventTap)
                      keyUp?.post(tap: .cghidEventTap)
                  }
              }
              RunLoop.current.run(until: Date().addingTimeInterval(0.5))
              print("Synthetic account field cleared: \((attribute(field, kAXValueAttribute) as? String) == "")")
          }
          print("Stage: synthetic UI input check. Apple login unattempted.")
          SWIFT
          swift "$work/probe.swift" "$bundle_id" "$nonce"
