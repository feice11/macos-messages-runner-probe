name: UU evidence probe

on:
  push:
    branches: [claude/uu-probe]

permissions:
  contents: read

concurrency:
  group: uu-probe
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Install UU Remote (same script as the sign-in session)
        run: bash scripts/install_uu.sh
      - name: Type-check the sign-in agent
        run: swiftc -typecheck scripts/runner_agent.swift
      - name: Self-test the UU one-click flow (QR shown, no scan; then the control switch)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          IMOCHIGE_SELFTEST=1 IMOCHIGE_LOGIN_WAIT=20 OUT="$RUNNER_TEMP/shots" swift scripts/runner_agent.swift
          screencapture -x "$RUNNER_TEMP/shots/selftest-end.png"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.runner }}
          path: ${{ runner.temp }}/shots
          retention-days: 1
