name: macOS Messages preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Check macOS and Messages
        shell: bash
        run: |
          version=$(sw_vers -productVersion)
          architecture=$(uname -m)
          printf 'macOS %s (%s)\n' "$version" "$architecture"
          [[ "$architecture" == arm64 && "${version%%.*}" -ge 15 ]]
          app=/System/Applications/Messages.app
          test -x "$app/Contents/MacOS/Messages"
          codesign --verify -- "$app"
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            printf '%s\n' 'Runner user has a GUI session.'
          else
            printf '%s\n' 'Runner user has no GUI session.'
          fi

      - name: Launch official Messages and check Screen Sharing
        shell: bash
        run: |
          open /System/Applications/Messages.app
          for attempt in {1..10}; do
            if pgrep -x Messages >/dev/null; then
              printf '%s\n' 'Apple Messages process is running.'
              break
            fi
            sleep 1
          done
          pgrep -x Messages >/dev/null
          if nc -z -G 2 127.0.0.1 5900; then
            printf '%s\n' 'Screen Sharing port is listening on loopback.'
          else
            printf '%s\n' 'Screen Sharing port is not listening on loopback.'
          fi

      - name: Check Apple endpoint TLS with macOS Network.framework
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -f "$work/probe.swift"; rmdir "$work"' EXIT
          cat > "$work/probe.swift" <<'SWIFT'
          import Dispatch
          import Network
          import Security

          func probe(host: String, port: UInt16) {
              let tls = NWProtocolTLS.Options()
              host.withCString {
                  sec_protocol_options_set_tls_server_name(tls.securityProtocolOptions, $0)
              }
              let connection = NWConnection(
                  host: NWEndpoint.Host(host),
                  port: NWEndpoint.Port(rawValue: port)!,
                  using: NWParameters(tls: tls, tcp: NWProtocolTCP.Options())
              )
              let settled = DispatchSemaphore(value: 0)
              connection.stateUpdateHandler = { state in
                  switch state {
                  case .ready:
                      print("\(host):\(port) TLS verified")
                      settled.signal()
                  case .waiting(let error), .failed(let error):
                      print("\(host):\(port) TLS unavailable (\(error))")
                      settled.signal()
                  default:
                      break
                  }
              }
              connection.start(queue: DispatchQueue(label: "messages-tls-preflight"))
              if settled.wait(timeout: .now() + 7) == .timedOut {
                  print("\(host):\(port) TLS timed out")
              }
              connection.cancel()
          }

          probe(host: "gsa.apple.com", port: 443)
          probe(host: "courier.push.apple.com", port: 5223)
          probe(host: "courier.push.apple.com", port: 443)
          print("Stage: application launch and transport check. Apple login and IDS registration untested.")
          SWIFT
          swift "$work/probe.swift"
