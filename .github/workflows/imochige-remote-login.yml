name: iMochige remote Apple sign-in
run-name: iMochige remote sign-in ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session marker (12 lowercase hex digits)
        type: string
        required: true
      issue:
        description: Issue number used as the encrypted message channel
        type: string
        required: true
      runner:
        description: macOS runner image
        type: choice
        options: [macos-15, macos-15-intel, macos-14, macos-26]
        default: macos-15
      uu:
        description: Install NetEase UU Remote for remote desktop
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: imochige-remote-login
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Install UU Remote
        if: inputs.uu
        shell: bash
        run: bash scripts/install_uu.sh
      - name: Run the encrypted sign-in agent
        shell: bash
        env:
          IMOCHIGE_KEY: ${{ secrets.IMOCHIGE_SESSION_KEY }}
          IMOCHIGE_SESSION: ${{ inputs.session_id }}
          IMOCHIGE_ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
          IMOCHIGE_MAX_MINUTES: "${{ inputs.uu && '125' || '38' }}"
          IMOCHIGE_IDLE_MINUTES: "${{ inputs.uu && '45' || '15' }}"
        run: |
          [[ "$IMOCHIGE_SESSION" =~ ^[0-9a-f]{12}$ ]] || { echo "Bad session marker"; exit 1; }
          [[ "$IMOCHIGE_ISSUE" =~ ^[0-9]+$ ]] || { echo "Bad issue number"; exit 1; }
          sw_vers
          # Give this throwaway VM's own login account a fresh random password so the
          # "Enter Mac Password" step of Apple sign-in can be answered. Sent to the
          # client only inside the encrypted channel; masked in the log.
          IMOCHIGE_MAC_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$IMOCHIGE_MAC_PASSWORD"
          user=$(id -un)
          # The runner account holds a SecureToken, so `dscl -passwd` wants the unknown old
          # password. On this SIP-disabled throwaway VM, rewrite the local shadow hash instead.
          sudo python3 - "$user" "$IMOCHIGE_MAC_PASSWORD" <<'PY'
          import hashlib, os, plistlib, sys
          user, password = sys.argv[1], sys.argv[2]
          path = f"/var/db/dslocal/nodes/Default/users/{user}.plist"
          with open(path, "rb") as handle:
              record = plistlib.load(handle)
          salt, rounds = os.urandom(32), 45000
          entropy = hashlib.pbkdf2_hmac("sha512", password.encode(), salt, rounds, 128)
          shadow = {"SALTED-SHA512-PBKDF2": {"entropy": entropy, "iterations": rounds, "salt": salt}}
          record["ShadowHashData"] = [plistlib.dumps(shadow, fmt=plistlib.FMT_BINARY)]
          with open(path, "wb") as handle:
              plistlib.dump(record, handle, fmt=plistlib.FMT_BINARY)
          print("Shadow hash rewritten")
          PY
          sudo killall opendirectoryd || true
          sleep 3
          if dscl . -authonly "$user" "$IMOCHIGE_MAC_PASSWORD"; then
            echo "Mac login password reset verified for $user"
            export IMOCHIGE_MAC_PASSWORD
            security delete-keychain "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
            # Keychain steps are best effort: a failure here must not stop the agent.
            security create-keychain -p "$IMOCHIGE_MAC_PASSWORD" login.keychain 2>&1 || echo "create-keychain failed ($?)"
            security default-keychain -s login.keychain 2>&1 || echo "default-keychain failed ($?)"
            security login-keychain -s login.keychain 2>&1 || echo "login-keychain failed ($?)"
            security unlock-keychain -p "$IMOCHIGE_MAC_PASSWORD" login.keychain 2>&1 || echo "unlock-keychain failed ($?)"
            echo "Login keychain recreated with the new password"
          else
            echo "Mac login password reset could not be verified"
            unset IMOCHIGE_MAC_PASSWORD
          fi
          swift scripts/runner_agent.swift
